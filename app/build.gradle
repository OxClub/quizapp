plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oxclub.quizapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.oxclub.quizapp"
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName "4.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
